[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Testler ag, GPU, Ollama, Stable Diffusion veya Instagram'a hic dokunmaz.
# Agir bagimliliklar tests/conftest.py icinde stub'lanir.
addopts =
    -q
    --strict-markers
    --tb=short

markers =
    backend: FastAPI uclarini TestClient ile calistiran testler
