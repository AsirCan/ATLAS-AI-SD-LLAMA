name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }} kur
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Bagimliliklari kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Testleri calistir
        # Testler ag, GPU, Ollama, Stable Diffusion veya Instagram'a dokunmaz;
        # agir bagimliliklar tests/conftest.py icinde stub'lanir.
        run: pytest --cov=core --cov=web/backend --cov-report=term-missing

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Bagimliliklari kur
        working-directory: web/frontend
        run: npm ci

      - name: Build
        working-directory: web/frontend
        run: npm run build
